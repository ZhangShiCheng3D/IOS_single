# project.yml — XcodeGen 项目定义（脚手架）
#
#     brew install xcodegen
#     cd apps/LumenPuzzle
#     xcodegen generate
#     open LumenPuzzle.xcodeproj

name: LumenPuzzle

options:
  bundleIdPrefix: com.lumenpuzzle
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""    # 上架前填入你的 Apple 开发团队 ID

targets:
  LumenPuzzle:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "Info.plist"
          - "LumenPuzzle.storekit"
          - "*.md"
          - "*.html"
          - "*.txt"
          - "project.yml"
          - ".git"
          - ".gitignore"
          - ".codegraph"
      - path: LumenPuzzle.storekit
        buildPhase: none
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.lumenpuzzle.app
        PRODUCT_NAME: LumenPuzzle
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_EMIT_LOC_STRINGS: YES
