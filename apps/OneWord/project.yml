# project.yml — XcodeGen 项目定义（脚手架）
#
#     brew install xcodegen
#     cd apps/OneWord
#     xcodegen generate
#     open OneWord.xcodeproj

name: OneWord

options:
  bundleIdPrefix: com.oneword
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""    # 上架前填入你的 Apple 开发团队 ID

targets:
  OneWord:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "Info.plist"
          - "OneWord.storekit"
          - "*.md"
          - "*.html"
          - "*.txt"
          - "project.yml"
          - "build"
          - "*.entitlements"
          - "Widgets"
          - ".git"
          - ".gitignore"
          - ".codegraph"
      - path: OneWord.storekit
        buildPhase: none
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.oneword.app
        PRODUCT_NAME: OneWord
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS: OneWord.entitlements
    dependencies:
      - target: OneWordWidget

  OneWordWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widgets/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.oneword.app.OneWordWidget
        PRODUCT_NAME: OneWordWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_ENTITLEMENTS: Widgets/OneWordWidget.entitlements
        SKIP_INSTALL: YES
