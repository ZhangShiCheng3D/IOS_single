name: RetroFilm
options:
  bundleIdPrefix: com.retrofilm
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RetroFilm:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "Info.plist"
          - "*.storekit"
          - "*.md"
          - "*.html"
          - "*.txt"
          - "project.yml"
          - "build"
          - ".git"
          - ".gitignore"
          - ".codegraph"
          - "*.entitlements"
          - "*.xcprivacy"
          - "*.py"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.retrofilm.app
        PRODUCT_NAME: RetroFilm
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_EMIT_LOC_STRINGS: YES
