# project.yml — XcodeGen 项目定义（可选脚手架）
#
# 本仓库的 App 默认不提交 Xcode 工程文件（.xcodeproj）。这导致这些源码
# 无法直接编译/运行/上 TestFlight。此文件用于在 macOS 上一键生成可构建工程：
#
#     brew install xcodegen          # 如未安装
#     cd apps/DocScanPro
#     xcodegen generate
#     open DocScanPro.xcodeproj
#
# 生成后，在 Scheme → Run → Options 里把「StoreKit Configuration」设为
# Configuration.storekit，即可本地联调内购。
#
# 说明：此文件在 Windows 环境下无法生成或验证，请在 Mac 上构建确认后再依赖。

name: DocScanPro

options:
  bundleIdPrefix: com.docscanpro
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""    # 上架前填入你的 Apple 开发团队 ID

targets:
  DocScanPro:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          # Info.plist 通过 INFOPLIST_FILE 引用，不作为资源重复打包
          - "Info.plist"
          # StoreKit 配置文件单独加入（不编译、不打包，仅供 Scheme 引用）
          - "Configuration.storekit"
          - "*.md"
          - "*.html"
          - "*.txt"
          - "project.yml"
          - ".git"
          - ".gitignore"
          - ".codegraph"
      - path: Configuration.storekit
        buildPhase: none
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.docscanpro.app
        PRODUCT_NAME: DocScanPro
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_EMIT_LOC_STRINGS: YES
